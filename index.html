<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var t = 'light';
      try {
        var saved = localStorage.getItem('ukd-theme');
        t = saved === 'light' || saved === 'dark' ? saved : 'light';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>html,body,#root{min-height:100%;background:#f0f5fc}html[data-theme="dark"],html[data-theme="dark"] body,html[data-theme="dark"] #root{background:#0b111b}</style>
  <script>
    /* Boot loader decision, made before first paint: show it on every full document load (first visit or refresh) of the
       homepage. In-app navigation never reloads the document, so it never replays; deep links to other routes skip it.
       Leaving the corridor through the logo / Home sets a one-shot flag, so that internal trip back home skips it too. */
    (function () {
      var on = false;
      try {
        var skip = sessionStorage.getItem('ukd-skip-boot') === '1';
        if (skip) sessionStorage.removeItem('ukd-skip-boot');
        on = location.pathname === '/' && !skip;
      } catch (e) { try { on = location.pathname === '/'; } catch (e2) {} }
      document.documentElement.setAttribute('data-boot', on ? 'on' : 'off');
    })();
  </script>
  <style id="boot-css">
    /* ==================================================================
       UKD BOOT LOADER — critical CSS. Lives here (not in the bundle) so it paints on the first frame, already in the correct
       theme. html[data-theme] is resolved by the script above before anything is painted; html[data-boot] says whether the
       loader shows: "on" (first visit of the session, homepage), "leaving" (receding), "off" / unset (never shown).
       ================================================================== */
    html[data-theme="light"],html[data-theme="light"] body{background:#f0f5fc}
    .boot{
      --boot-bg:
        radial-gradient(ellipse 58% 72% at 76% 46%,rgb(66 92 240 / .075),transparent 72%),
        radial-gradient(ellipse 52% 60% at 6% 104%,rgb(150 170 204 / .2),transparent 74%),
        linear-gradient(180deg,#f8fbff 0%,#f0f5fc 54%,#e7eef8 100%);
      --boot-ink:#09111d;--boot-muted:#5a6472;--boot-grid:rgb(52 78 140 / .055);--boot-pitch:72px;
      position:fixed;inset:0;z-index:2147483000;display:none;place-items:center;overflow:hidden;
      background:var(--boot-bg);color:var(--boot-ink);
      -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;
      transition:opacity .58s cubic-bezier(.3,0,.1,1),visibility 0s linear .58s;
    }
    html[data-theme="dark"] .boot{
      --boot-bg:
        radial-gradient(ellipse 54% 68% at 76% 46%,rgb(69 93 255 / .14),transparent 72%),
        radial-gradient(ellipse 50% 56% at 6% 104%,rgb(80 110 190 / .1),transparent 74%),
        linear-gradient(180deg,#0c1322 0%,#0b111b 100%);
      --boot-ink:#eceff5;--boot-muted:#95a2b7;--boot-grid:rgb(170 190 255 / .045)
    }
    html[data-boot="on"] .boot,html[data-boot="leaving"] .boot{display:grid}
    html[data-boot="leaving"] .boot{opacity:0;visibility:hidden;pointer-events:none}

    /* PHASE 1 — the same vertical-only technical field as the Splash, kept quiet so the UKD mark stays primary. */
    .boot__grid{
      position:absolute;inset:0;opacity:0;
      background-image:linear-gradient(90deg,var(--boot-grid) 1px,transparent 1px);
      background-size:var(--boot-pitch) 100%;background-position:center top;
      animation:boot-grid 1.2s cubic-bezier(.22,.8,.18,1) .04s forwards;
    }
    @keyframes boot-grid{to{opacity:1}}

    /* Four slow, independently phased signal traces echo the Splash without copying its density. */
    .boot__signals{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .boot__trace{
      position:absolute;top:-170px;width:1px;height:130px;opacity:.18;
      background:linear-gradient(180deg,transparent 0%,rgb(163 184 255 / .18) 18%,rgb(83 104 255 / .72) 52%,rgb(163 184 255 / .2) 78%,transparent 100%);
      animation:boot-trace var(--trace-dur) linear var(--trace-delay) infinite;
      will-change:transform;
    }
    .boot__trace:nth-child(1){left:calc(50% - 288px);--trace-dur:8.8s;--trace-delay:-2.4s}
    .boot__trace:nth-child(2){left:calc(50% - 72px);--trace-dur:7.2s;--trace-delay:-3.8s;height:108px;opacity:.15}
    .boot__trace:nth-child(3){left:calc(50% + 144px);--trace-dur:9.6s;--trace-delay:-6.8s;height:146px;opacity:.16}
    .boot__trace:nth-child(4){left:calc(50% + 288px);--trace-dur:6.9s;--trace-delay:-1.1s;height:118px;opacity:.14}
    @keyframes boot-trace{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,calc(100vh + 340px),0)}}

    .boot__stage{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px;left:var(--boot-dx,0px);top:var(--boot-dy,-1.6vh);transition:transform .58s cubic-bezier(.3,0,.1,1)}
    html[data-boot="leaving"] .boot__stage{transform:translate3d(0,-1.4vh,0) scale(.985)}

    /* PHASE 2 — the mark. The exact ukd-logo.svg is used as-is; it is revealed with a wipe whose edge runs parallel to the
       logo's own diagonal, while opacity and a 3.5% settle ease in. No blur, no bounce, no overshoot. */
    .boot__logo{
      position:relative;
      width:clamp(232px,min(28vw,calc(36vh * 2.415)),430px);
      aspect-ratio:1362/564;
      opacity:0;
      clip-path:polygon(-50% -6%,-4% -6%,-55.5% 106%,-50% 106%);
    }
    .boot__logo img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
    html[data-theme="dark"] .boot__logo img{filter:invert(1) hue-rotate(180deg) brightness(1.06) saturate(1.15)}
    .boot--play .boot__logo{animation:boot-logo 1.2s cubic-bezier(.4,0,.15,1) .1s forwards}
    @keyframes boot-logo{
      0%{opacity:0;transform:scale(1.035);clip-path:polygon(-50% -6%,-4% -6%,-55.5% 106%,-50% 106%)}
      34%{opacity:1}
      100%{opacity:1;transform:scale(1);clip-path:polygon(-50% -6%,155.5% -6%,104% 106%,-50% 106%)}
    }

    .boot__accent i{
      position:absolute;top:-8%;bottom:-8%;left:0;width:19%;opacity:0;
      background:linear-gradient(90deg,rgba(190,214,255,0),rgba(214,231,255,.9) 50%,rgba(190,214,255,0));
      transform:translate3d(200%,0,0) skewX(30deg);
    }
    .boot--play .boot__accent i{animation:boot-sweep 1.05s cubic-bezier(.45,0,.25,1) .98s forwards}
    @keyframes boot-sweep{
      0%{opacity:0;transform:translate3d(200%,0,0) skewX(30deg)}
      22%{opacity:.9}
      78%{opacity:.9}
      100%{opacity:0;transform:translate3d(385%,0,0) skewX(30deg)}
    }

    /* TEXT — after the mark settles: name, then role, then the helper line. Small rise + fade, quiet stagger. */
    .boot__name,.boot__role,.boot__helper{margin:0;opacity:0;transform:translate3d(0,10px,0)}
    .boot__name{margin-top:clamp(26px,4.6vh,42px);font:800 clamp(1.05rem,1.45vw,1.3rem)/1.2 Manrope,system-ui,sans-serif;letter-spacing:-.012em}
    .boot__role{margin-top:10px;font:500 clamp(.68rem,.82vw,.78rem)/1.45 "DM Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.075em;color:var(--boot-muted)}
    .boot__helper{margin-top:clamp(34px,5.6vh,52px);font:500 .69rem/1.4 "DM Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;color:var(--boot-muted);--o:.8}
    .boot--play .boot__name{animation:boot-rise .72s cubic-bezier(.22,.8,.18,1) 1.12s forwards}
    .boot--play .boot__role{animation:boot-rise .72s cubic-bezier(.22,.8,.18,1) 1.25s forwards}
    .boot--play .boot__helper{animation:boot-rise .72s cubic-bezier(.22,.8,.18,1) 1.38s forwards,boot-breathe 2.8s ease-in-out 2.3s infinite alternate}
    @keyframes boot-rise{to{opacity:var(--o,1);transform:none}}
    @keyframes boot-breathe{from{opacity:.8}to{opacity:.5}}

    /* While the loader is up, the homepage is already mounted underneath but its own reveal is held. It resumes a beat after the
       loader starts to recede (data-hero-go), so the page arrives as the loader leaves, without the two identities overlapping. */
    html[data-boot="on"] .entry-intro-copy,html[data-boot="on"] .entry-portrait,
    html[data-boot="leaving"]:not([data-hero-go]) .entry-intro-copy,html[data-boot="leaving"]:not([data-hero-go]) .entry-portrait{animation-play-state:paused}

    @media (max-width:640px){
      .boot__logo{width:clamp(210px,64vw,300px)}
      .boot__stage{padding:0 20px}
      .boot__trace:nth-child(1),.boot__trace:nth-child(4){display:none}
    }
    /* Reduced motion: same identity, no wipe, no sweep, no travel — quick fades only. */
    @media (prefers-reduced-motion:reduce){
      .boot{transition-duration:.25s,0s;transition-delay:0s,.25s}
      .boot__grid{animation-duration:.3s}
      .boot__logo{clip-path:none}
      .boot--play .boot__logo{animation:boot-fade .28s ease .02s forwards}
      .boot__accent,.boot__signals{display:none}
      .boot__name,.boot__role,.boot__helper{transform:none}
      .boot--play .boot__name{animation:boot-fade .28s ease .1s forwards}
      .boot--play .boot__role{animation:boot-fade .28s ease .16s forwards}
      .boot--play .boot__helper{animation:boot-fade .28s ease .22s forwards}
      html[data-boot="leaving"] .boot__stage{transform:none}
    }
    @keyframes boot-fade{to{opacity:var(--o,1);transform:none}}

  <script>
    /* Starts the choreography once the mark and the fonts are actually available (never waits more than ~1s), so the sequence
       never plays on a blank image or swaps fonts mid-reveal. */
    (function () {
      var root = document.documentElement, el = document.getElementById('boot');
      if (!el || root.getAttribute('data-boot') !== 'on') return;
      var played = false;
      var stage = el.querySelector('.boot__stage'), mark = el.querySelector('.boot__logo');
      /* Lands the mark on whole device pixels (size + position) so the SVG rasterises crisply instead of being resampled at a
         fractional offset. Purely a sub-pixel correction: the mark keeps its size and place, no layout jump. */
      function snap() {
        if (root.getAttribute('data-boot') !== 'on') return;
        stage.style.transition = 'none';
        stage.style.setProperty('--boot-dx', '0px'); stage.style.setProperty('--boot-dy', '0px'); mark.style.width = '';
        mark.style.width = Math.round(mark.getBoundingClientRect().width) + 'px';
        var r = mark.getBoundingClientRect(), base = -0.016;
        stage.style.setProperty('--boot-dx', (Math.round(r.left) - r.left) + 'px');
        stage.style.setProperty('--boot-dy', (Math.round(r.top + base * window.innerHeight) - r.top) + 'px');
        void stage.offsetWidth; stage.style.transition = '';
      }
      function play() {
        if (played) return; played = true;
        snap();
        window.addEventListener('resize', snap);
        window.__ukdBootPlayAt = performance.now();
        el.classList.add('boot--play');
      }
      var img = el.querySelector('img');
      var logo = new Promise(function (res) {
        if (img.complete && img.naturalWidth) res();
        else { img.addEventListener('load', res, { once: true }); img.addEventListener('error', res, { once: true }); }
      });
      var fonts = (document.fonts && document.fonts.load)
        ? Promise.all([document.fonts.load('800 24px Manrope'), document.fonts.load('500 12px "DM Mono"')]).catch(function () {})
        : Promise.resolve();
      Promise.all([logo, fonts]).then(play);
      setTimeout(play, 1000);
      // Absolute fallback: if the app never releases the loader, never trap the visitor behind it.
      setTimeout(function () { root.setAttribute('data-boot', 'off'); if (el.parentNode) el.parentNode.removeChild(el); }, 15000);
    })();
