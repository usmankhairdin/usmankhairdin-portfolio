name: Capture PRIMA screenshots (temporary)

on:
  push:
    branches:
      - capture/prima-screens

permissions:
  contents: write

jobs:
  capture:
    if: "!startsWith(github.event.head_commit.message, 'Captured')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and sharp (runner only, nothing committed)
        run: |
          npm install --no-save --no-audit --no-fund playwright sharp
          npx playwright install --with-deps chromium

      - name: Second pass for the redesigned site
        run: mkdir -p review && node .github/capture/prima-v2.mjs

      - name: Commit the captures back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add review
          git commit -m "Captured PRIMA screenshots v2 ($GITHUB_RUN_ID)"
          git push
