name: Capture PRIMA screenshots (temporary)

on:
  push:
    branches:
      - capture/prima-screens

permissions:
  contents: write

jobs:
  capture:
    if: "!startsWith(github.event.head_commit.message, 'Captured')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and sharp (runner only, nothing committed)
        run: |
          npm install --no-save --no-audit --no-fund playwright sharp
          npx playwright install --with-deps chromium

      - name: Point the repo's Windows-only capture scripts at the runner's packages
        run: |
          for f in scripts/capture-portfolio-media.mjs scripts/capture-case-study-evidence.mjs scripts/capture-prima-fullpage.mjs; do
            sed -i "s#require('C:/Users/Usman/.cache/codex-runtimes/codex-primary-runtime/dependencies/node/node_modules/\(playwright\|sharp\)')#require('\1')#" "$f"
            sed -i "s#executablePath: chrome, ##; /executablePath: 'C:/d" "$f"
            grep -n "require('\|launch(" "$f"
          done

      - name: hero, detail, mobile (capture-portfolio-media.mjs)
        run: mkdir -p review && node scripts/capture-portfolio-media.mjs prima 2>&1 | tee -a review/log.txt

      - name: case-study evidence ev-* (capture-case-study-evidence.mjs)
        run: mkdir -p review && node scripts/capture-case-study-evidence.mjs prima 2>&1 | tee -a review/log.txt

      - name: fullpage (capture-prima-fullpage.mjs)
        run: mkdir -p review && node scripts/capture-prima-fullpage.mjs 2>&1 | tee -a review/log.txt

      - name: showcase (homepage top, 1440x900 at 2x)
        run: mkdir -p review && node .github/capture/showcase.mjs 2>&1 | tee -a review/log.txt

      - name: Current portfolio pages, for reviewing where PRIMA appears
        run: mkdir -p review && node .github/capture/review.mjs 2>&1 | tee -a review/log.txt

      - name: Commit the captures back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -- scripts
          git add public/assets/projects/prima review
          git commit -m "Captured PRIMA screenshots ($GITHUB_RUN_ID)"
          git push
