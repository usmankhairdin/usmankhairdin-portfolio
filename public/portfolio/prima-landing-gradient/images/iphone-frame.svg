<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1950" viewBox="0 0 900 1950" fill="none" role="img" aria-label="iPhone frame">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>
    <mask id="bezelMask">
      <!-- White = visible; Black = hole -->
      <rect x="10" y="10" width="880" height="1930" rx="150" fill="white"/>
      <rect x="80" y="120" width="740" height="1720" rx="90" fill="black"/>
    </mask>
  </defs>
  <!-- Bezel with masked screen hole -->
  <rect x="10" y="10" width="880" height="1930" rx="150" fill="url(#bezel)" stroke="#CBD5E1" stroke-width="20" mask="url(#bezelMask)"/>
  <!-- Inner glass edge highlight -->
  <rect x="40" y="40" width="820" height="1870" rx="130" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <!-- Speaker + camera island -->
  <rect x="350" y="70" width="200" height="32" rx="16" fill="#E5E7EB"/>
  <circle cx="520" cy="86" r="6" fill="#CBD5E1"/>
</svg>

