    <script>
      /* Apply the saved or system theme before first paint (shared with the website). */
      (function () {
        var root = document.documentElement, saved;
        try { saved = localStorage.getItem('sanaira-theme'); } catch (e) {}
        var forced = location.search.match(/[?&]theme=(dark|light)/);
        if (forced) saved = forced[1];
        var theme = saved === 'dark' || saved === 'light' ? saved : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
      })();
    </script>
    <script type="module" crossorigin src="/portfolio/sanaira/app/assets/index-CGygfogM.js"></script>
    <link rel="stylesheet" crossorigin href="/portfolio/sanaira/app/assets/index-bCWi286p.css">
  </head>
