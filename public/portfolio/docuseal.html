<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trusted by Section – Gradient Redesign</title>

  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Marquee animation */
    @keyframes marquee-scroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    .marquee-track {
      display: flex;
      gap: 4rem;
      width: max-content;
      animation: marquee-scroll 25s linear infinite;
    }

    .marquee:hover .marquee-track {
      animation-play-state: paused;
    }

    .marquee img {
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .marquee img:hover {
      transform: scale(1.2);
      filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.15));
    }
  </style>
</head>

<body class="antialiased bg-gradient-to-b from-[#fff8f0] to-[#fdf2e9]">

  <!-- Trusted by Section -->
  <section id="trusted-by" class="py-20">
    <div class="max-w-7xl mx-auto px-6">

      <!-- Heading -->
      <div class="text-center mb-14">
        <h2 class="text-lg font-semibold text-gray-600 tracking-wide uppercase">Trusted by</h2>

        <p class="mt-4 text-[64px] font-extrabold mx-auto w-fit rounded-full py-3 px-12 shadow-xl text-gray-900 bg-gradient-to-r from-yellow-200 via-yellow-400 to-yellow-500">
          111,800
        </p>

        <h2 class="mt-6 text-5xl md:text-6xl font-bold text-gray-900 leading-tight max-w-4xl mx-auto">
          Businesses & Individuals Rely on
          <span class="relative inline-block text-transparent bg-clip-text bg-gradient-to-r from-amber-500 to-orange-500">
            DocuSeal
          </span>
        </h2>
      </div>

      
    </div>
    <!-- Logo Marquee -->
      <div class="marquee overflow-hidden relative py-6 ">
        <div class="marquee-track">
          <!-- Logos (repeat twice for infinite scroll) -->
          <template id="logos">
            <div class="flex items-center justify-center">
              <img alt="UC San Diego" class="h-20 w-auto" src="https://www.docuseal.com/packs/static/images/clients/us-san-diego-logo-b7adee9dc25258a9550e.png">
            </div>
            <div class="flex items-center justify-center">
              <img alt="B2B Rocket" class="h-20 w-auto" src="https://www.docuseal.com/packs/static/images/clients/b2brocket-logo-3eb8c339ad09d3ddc4a0.png">
            </div>
            <div class="flex items-center justify-center">
              <img alt="Jordan & Skala Engineers" class="h-20 w-auto" src="https://www.docuseal.com/packs/static/images/clients/jordan-and-skala-logo-a49114b1481ecdbdc99a.png">
            </div>
            <div class="flex items-center justify-center">
              <img alt="Vogelbusch Biopharma" class="h-20 w-auto" src="https://www.docuseal.com/packs/static/images/clients/vogelbusch-biopharma-logo-136bc4bf24eb636aa4bf.png">
            </div>
            <div class="flex items-center justify-center">
              <img alt="Universitat Pompeu Fabra" class="h-20 w-auto" src="https://www.docuseal.com/packs/static/images/clients/universitat-pompeu-fabra-logo-4e52cac133c9cd0bb8e3.png">
            </div>
          </template>

          <!-- Duplicate logos twice -->
          <div class="flex items-center gap-16"> 
            <script>
              // JS to duplicate template twice for smooth scrolling
              const template = document.getElementById("logos");
              for (let i = 0; i < 2; i++) {
                document.currentScript.insertAdjacentHTML('beforebegin', template.innerHTML);
              }
            </script>
          </div>
        </div>
      </div>

      <!-- CTA Button -->
      <div class="mt-12 text-center">
        <a href="#" class="inline-block px-10 py-5 rounded-full text-xl font-bold text-white shadow-lg transition transform hover:scale-105 hover:shadow-2xl bg-gradient-to-r from-amber-500 to-orange-500">
          See Case Studies
        </a>
      </div>
  </section>

</body>

</html>
